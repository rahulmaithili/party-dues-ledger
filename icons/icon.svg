<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="cylGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#EF4444"/>
      <stop offset="70%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Golden Rupee / Ledger Badge Background -->
  <circle cx="360" cy="150" r="64" fill="url(#goldGrad)" filter="url(#glow)"/>
  <text x="360" y="174" font-family="'Inter', Arial, sans-serif" font-weight="900" font-size="68" fill="#1E1B4B" text-anchor="middle">₹</text>

  <!-- LPG Gas Cylinder Illustration -->
  <g transform="translate(140, 100)">
    <!-- Top Handle Guard Ring -->
    <path d="M 40 40 C 40 15, 120 15, 120 40 L 120 70 L 40 70 Z" fill="none" stroke="url(#metalGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Center Valve / Nozzle -->
    <rect x="70" y="45" width="20" height="25" rx="3" fill="#E2E8F0"/>
    <circle cx="80" cy="42" r="7" fill="#F59E0B"/>

    <!-- Cylinder Main Shoulder Dome -->
    <path d="M 10 130 C 10 65, 150 65, 150 130 Z" fill="url(#cylGrad)"/>

    <!-- Cylinder Main Body Trunk -->
    <rect x="10" y="130" width="140" height="150" fill="url(#cylGrad)"/>

    <!-- Cylinder Center Weld Ribs -->
    <line x1="10" y1="170" x2="150" y2="170" stroke="rgba(0,0,0,0.25)" stroke-width="3"/>
    <line x1="10" y1="230" x2="150" y2="230" stroke="rgba(0,0,0,0.25)" stroke-width="3"/>

    <!-- Cylinder Bottom Dome -->
    <path d="M 10 280 C 10 320, 150 320, 150 280 Z" fill="url(#cylGrad)"/>

    <!-- Bottom Foot Ring Base -->
    <rect x="30" y="305" width="100" height="22" rx="6" fill="url(#metalGrad)"/>
    <ellipse cx="80" cy="316" rx="28" ry="4" fill="rgba(0,0,0,0.4)"/>

    <!-- Flame Motif inside Cylinder Body -->
    <path d="M 80 160 C 95 190, 110 205, 110 225 C 110 245, 95 260, 80 260 C 65 260, 50 245, 50 225 C 50 205, 65 190, 80 160 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
    <path d="M 80 195 C 88 210, 95 220, 95 232 C 95 244, 88 252, 80 252 C 72 252, 65 244, 65 232 C 65 220, 72 210, 80 195 Z" fill="#FFFBEB"/>
  </g>

  <!-- Modern ERP Branding Banner at Bottom -->
  <rect x="80" y="415" width="352" height="52" rx="16" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  <text x="256" y="449" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">SHIV SHAKTI ERP</text>
</svg>
